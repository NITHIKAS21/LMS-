<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced LMS – Single File</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


  
<style>
/* ================= ROOT THEME ================= */
:root{
  --bg:#f2f4f8;
  --text:#1f2937;
  --card:#ffffff;
  --primary:#2563eb;
  --secondary:#0f172a;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#dc2626;
  --shadow:0 10px 25px rgba(0,0,0,0.08);
}
body.dark{
  --bg:#0f172a;
  --text:#e5e7eb;
  --card:#1e293b;
  --primary:#38bdf8;
  --shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* ================= GLOBAL ================= */
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--text)}
.hidden{display:none}
button{border:none;background:var(--primary);color:#fff;padding:10px 16px;border-radius:6px;cursor:pointer}
img{max-width:100%}

/* ================= LOGIN ================= */
#loginPage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#2563eb,#0ea5e9);
}
.login-card{
  background:#fff;
  width:360px;
  padding:30px;
  border-radius:12px;
  box-shadow:var(--shadow);
}
.login-card h2{text-align:center;margin-bottom:20px}
.login-card input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:6px;
}
.error{color:var(--danger);font-size:14px}

/* ================= LAYOUT ================= */
#app{display:flex;min-height:100vh}
.sidebar{
  width:260px;
  background:var(--card);
  box-shadow:var(--shadow);
  padding:20px;
  transition:.3s;
}
.sidebar h3{text-align:center;margin-bottom:20px}
.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  text-decoration:none;
  color:var(--text);
  border-radius:8px;
}
.sidebar a.active,
.sidebar a:hover{
  background:var(--primary);
  color:#fff;
}
.main{
  flex:1;
  padding:20px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.menu-btn{display:none}

/* ================= DASHBOARD ================= */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  box-shadow:var(--shadow);
}
.card img{height:60px;margin-bottom:10px}

/* ================= COURSES ================= */
.course-card img{border-radius:10px;height:140px;object-fit:cover}

/* ================= ASSIGNMENTS ================= */
.assignment{
  background:var(--card);
  padding:16px;
  border-radius:10px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.status.pending{color:var(--warning)}
.status.submitted{color:var(--success)}
.status.late{color:var(--danger)}

/* ================= PROFILE ================= */
.profile-box input{
  width:100%;
  padding:10px;
  margin:8px 0;
}

/* ================= ALERT ================= */
.alert{
  position:fixed;
  top:20px;
  right:20px;
  background:var(--success);
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  box-shadow:var(--shadow);
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
  .sidebar{position:absolute;left:-100%;height:100%}
  .sidebar.show{left:0}
  .menu-btn{display:block}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <h2>LMS Portal</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <div id="loginError" class="error"></div>
    <button id="loginBtn" style="width:100%">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <h3>📘 LMS</h3>
    <a class="nav active" data-page="dashboard">🏠 Dashboard</a>
    <a class="nav" data-page="courses">📚 Courses</a>
    <a class="nav" data-page="assignments">📝 Assignments</a>
    <a class="nav" data-page="profile">👤 Profile</a>
    <button id="themeToggle" style="margin-top:20px;width:100%">🌙 Theme</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
    </div>

    <!-- DASHBOARD -->
    <section id="dashboard">
      <div class="cards" id="dashboardCards"></div>
    </section>

    <!-- COURSES -->
    <section id="courses" class="hidden">
      <div class="cards" id="courseList"></div>
    </section>

    <!-- ASSIGNMENTS -->
    <section id="assignments" class="hidden">
      <div id="assignmentList"></div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="hidden">
      <div class="card profile-box">
        <input id="profileName" value="Student" disabled>
        <input value="student@bitsathy.ac.in" disabled>
        <button id="editProfile">Edit Profile</button>
      </div>
    </section>
  </main>
</div>

<script>
/* ================= LOGIN ================= */
loginBtn.onclick=()=>{
  if(!username.value||!password.value){
    loginError.textContent="All fields required";
    return;
  }
  loginPage.classList.add("hidden");
  app.classList.remove("hidden");
  alertMsg("Login Successful");
};

/* ================= SIDEBAR ================= */
menuBtn.onclick=()=>sidebar.classList.toggle("show");

/* ================= DASHBOARD DATA ================= */
const stats=[
 {title:"Total Courses",value:6,img:"https://cdn-icons-png.flaticon.com/512/3135/3135755.png"},
 {title:"Assignments Due",value:3,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png"},
 {title:"Attendance",value:"94%",img:"https://cdn-icons-png.flaticon.com/512/942/942748.png"},
 {title:"GPA",value:"8.9",img:"https://cdn-icons-png.flaticon.com/512/1995/1995574.png"}
];
stats.forEach(s=>{
  dashboardCards.innerHTML+=`
  <div class="card">
    <img src="${s.img}">
    <h3>${s.title}</h3>
    <p>${s.value}</p>
  </div>`;
});

/* ================= COURSES ================= */
const courses=[
 {name:"Data Structures",img:"https://images.unsplash.com/photo-1518770660439-4636190af475",status:"Active"},
 {name:"DBMS",img:"https://images.unsplash.com/photo-1555066931-4365d14bab8c",status:"Completed"}
];
courses.forEach(c=>{
  courseList.innerHTML+=`
  <div class="card course-card">
    <img src="${c.img}">
    <h3>${c.name}</h3>
    <p>${c.status}</p>
  </div>`;
});

/* ================= ASSIGNMENTS ================= */
const assigns=[
 {title:"Stack Program",due:"2026-02-20",status:"Pending"}
];
assigns.forEach(a=>{
  const today=new Date().toISOString().split("T")[0];
  let st=a.status;
  if(today>a.due) st="Late";
  assignmentList.innerHTML+=`
  <div class="assignment">
    <h4>${a.title}</h4>
    <span class="status ${st.toLowerCase()}">${st}</span><br><br>
    <button ${st!=="Pending"?"disabled":""}>Submit</button>
  </div>`;
});
assignmentList.onclick=e=>{
  if(e.target.tagName==="BUTTON"){
    e.target.previousElementSibling.textContent="Submitted";
    e.target.previousElementSibling.className="status submitted";
    e.target.disabled=true;
    alertMsg("Assignment Submitted");
  }
};

/* ================= PROFILE ================= */
editProfile.onclick=()=>{
  profileName.disabled=!profileName.disabled;
  editProfile.textContent=profileName.disabled?"Edit Profile":"Save";
  if(profileName.disabled) alertMsg("Profile Updated");
};

/* ================= THEME ================= */
if(localStorage.theme==="dark")document.body.classList.add("dark");
themeToggle.onclick=()=>{
  document.body.classList.toggle("dark");
  localStorage.theme=document.body.classList.contains("dark")?"dark":"light";
};

/* ================= NAV ================= */
document.querySelectorAll(".nav").forEach(n=>{
  n.onclick=()=>{
    document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
    document.getElementById(n.dataset.page).classList.remove("hidden");
    document.querySelectorAll(".nav").forEach(a=>a.classList.remove("active"));
    n.classList.add("active");
    pageTitle.textContent=n.textContent;
  };
});

/* ================= ALERT ================= */
function alertMsg(msg){
  const a=document.createElement("div");
  a.className="alert";
  a.textContent=msg;
  document.body.appendChild(a);
  setTimeout(()=>a.remove(),3000);
}
</script>
</body>
</html>
